name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Set lowercase repo name
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}:latest

      # 👇 A CORREÇÃO ESTÁ AQUI: o passo só roda se o segredo existir
      - name: Trigger deploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_URL }}
        if: env.RENDER_HOOK != ''
        run: curl --data-urlencode "imgURL=ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}" "$RENDER_HOOK"